name: Security Control Modification

description: >
  Detects deletion of Azure security monitoring or policy controls.

severity: High

enabled: true

query: |
  AzureActivity
  | where OperationNameValue has_any (
      "MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE",
      "MICROSOFT.AUTHORIZATION/POLICYASSIGNMENTS/DELETE",
      "MICROSOFT.AUTHORIZATION/POLICYDEFINITIONS/DELETE"
  )
  | project
      TimeGenerated,
      Caller,
      OperationNameValue,
      ResourceGroup,
      ResourceId,
      ActivityStatusValue

queryFrequency: PT5M
queryPeriod: PT10M
triggerOperator: GreaterThan
triggerThreshold: 0

tactics:
  - DefenseEvasion

techniques:
  - T1562