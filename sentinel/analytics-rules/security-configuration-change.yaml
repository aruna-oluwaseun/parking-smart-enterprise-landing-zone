id: e3b31cac-5333-49eb-b04b-a0923b131df3
name: Security Configuration Change

description: |
  Detects deletion or modification of Azure monitoring, policy,
  or defensive security controls that may reduce security visibility
  or weaken the environment's defensive posture.

severity: High
kqlFile: security-configuration-change.kql
enabled: true
kind: Scheduled

kqlFile: security_configuration_change.kql

queryFrequency: 5m
queryPeriod: 10m

triggerOperator: gt
triggerThreshold: 0

tactics:
  - DefenseEvasion

relevantTechniques:
  - T1685

query: |
  AzureActivity
  | where OperationNameValue has_any (
      "MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE",
      "MICROSOFT.AUTHORIZATION/POLICYASSIGNMENTS/DELETE",
      "MICROSOFT.AUTHORIZATION/POLICYDEFINITIONS/DELETE"
  )
  | project
      TimeGenerated,
      Caller,
      OperationNameValue,
      ResourceGroup,
      ResourceId,
      ActivityStatusValue
  | order by TimeGenerated desc

entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: Caller

eventGroupingSettings:
  aggregationKind: SingleAlert

version: 1.0.0