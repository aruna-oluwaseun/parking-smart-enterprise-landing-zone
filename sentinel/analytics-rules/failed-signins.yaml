name: Multiple Failed Sign-ins

description: >
  Detects repeated failed Microsoft Entra ID authentication attempts
  from the same user and IP address.

severity: Medium

enabled: true

query: |
  SigninLogs
  | where ResultType != 0
  | summarize
      FailedAttempts = count(),
      FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated)
      by UserPrincipalName, IPAddress
  | where FailedAttempts >= 5
  | project
      FirstSeen,
      LastSeen,
      UserPrincipalName,
      IPAddress,
      FailedAttempts

queryFrequency: PT5M
queryPeriod: PT10M
triggerOperator: GreaterThan
triggerThreshold: 0

tactics:
  - CredentialAccess

techniques:
  - T1110