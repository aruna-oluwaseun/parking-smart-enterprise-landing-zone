id: ce014747-a73d-4e91-8ae8-f2ff7d6e13c5
name: Key Vault access spike
description: |
  Detects unusually high volumes of Key Vault activity from a single source IP address.
severity: High
enabled: true
kqlFile: keyvault_access_spike.kql
kind: Scheduled

queryFrequency: 5m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0

tactics:
  - CredentialAccess

relevantTechniques:
  - T1555.006

query: |
  AzureDiagnostics
  | where ResourceType == "VAULTS"
  | summarize
      AccessCount = count(),
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated)
      by CallerIPAddress
  | where AccessCount > 50
  | project
      TimeGenerated = EndTime,
      StartTime,
      EndTime,
      CallerIPAddress,
      AccessCount

entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIPAddress

version: 1.0.0
