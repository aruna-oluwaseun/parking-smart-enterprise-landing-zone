id: 2f693d11-fcac-4281-92c2-51e0ce124c6b
name: Storage public access configuration changed
description: |
  Detects Azure Storage configuration changes that may expose cloud data publicly.
severity: High
kqlFile: storage_public_access_enabled.kql
enabled: true
kind: Scheduled

queryFrequency: 5m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0

tactics:
  - Collection

relevantTechniques:
  - T1530

query: |
  AzureActivity
  | where ResourceProviderValue =~ "MICROSOFT.STORAGE"
  | where OperationNameValue has "STORAGEACCOUNTS/WRITE"
  | project
      TimeGenerated,
      Caller,
      OperationNameValue,
      ResourceGroup,
      ResourceId,
      ActivityStatusValue,
      Properties

version: 1.0.0
