name: Multiple Geographic Sign-in Locations

description: >
  Detects users authenticating from multiple geographic locations
  within a short period.

severity: Medium

enabled: true

query: |
  SigninLogs
  | summarize
      Locations = make_set(Location),
      SigninCount = count()
      by UserPrincipalName, bin(TimeGenerated, 1h)
  | where array_length(Locations) > 1
  | project
      TimeGenerated,
      UserPrincipalName,
      Locations,
      SigninCount

queryFrequency: PT15M
queryPeriod: PT1H
triggerOperator: GreaterThan
triggerThreshold: 0

tactics:
  - InitialAccess
  - Persistence

techniques:
  - T1078