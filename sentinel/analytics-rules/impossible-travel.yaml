id: a1afaab2-9b67-4ab2-91c5-a6e171a38924
name: Multiple Geographic Sign-in Locations

description: |
  Detects a Microsoft Entra ID user authenticating from multiple
  geographic locations within a short period, which may indicate
  compromised credentials.

severity: Medium
enabled: true
kqlFile: impossible_travel.kql
kind: Scheduled

queryFrequency: 15m
queryPeriod: 1h

triggerOperator: gt
triggerThreshold: 0

tactics:
  - InitialAccess
  - Persistence

relevantTechniques:
  - T1078

query: |
  SigninLogs
  | summarize
      Locations = make_set(Location),
      SigninCount = count()
      by UserPrincipalName, bin(TimeGenerated, 1h)
  | where array_length(Locations) > 1
  | project
      TimeGenerated,
      UserPrincipalName,
      Locations,
      SigninCount

entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserPrincipalName

eventGroupingSettings:
  aggregationKind: SingleAlert

version: 1.0.0