id: 5309e061-37dc-436f-9241-7415cbee3446
name: Excessive Key Vault secret access
description: |
  Detects unusually high volumes of Azure Key Vault secret retrieval activity.
severity: High
kind: Scheduled

queryFrequency: 5m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0

tactics:
  - CredentialAccess

relevantTechniques:
  - T1555.006

query: |
  AzureDiagnostics
  | where OperationName contains "SecretGet"
  | summarize
      SecretRequests = count(),
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated)
      by CallerIPAddress
  | where SecretRequests > 20
  | project
      TimeGenerated = EndTime,
      StartTime,
      EndTime,
      CallerIPAddress,
      SecretRequests

entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIPAddress

version: 1.0.0