id: e09279a1-0308-4f88-a26b-224ad586e644
name: Password spray against Entra ID accounts
description: |
  Detects a single source IP generating authentication failures
  against multiple Microsoft Entra ID accounts in a short period.
severity: High
enabled: true
kqlFile: password_spray.kql
kind: Scheduled

queryFrequency: 5m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0

tactics:
  - CredentialAccess

relevantTechniques:
  - T1110.003

query: |
  SigninLogs
  | where ResultType != 0
  | summarize
      FailedAttempts = count(),
      TargetAccounts = dcount(UserPrincipalName),
      Accounts = make_set(UserPrincipalName, 20),
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated)
      by IPAddress
  | where FailedAttempts >= 20
  | where TargetAccounts >= 5
  | project
      TimeGenerated = EndTime,
      StartTime,
      EndTime,
      IPAddress,
      FailedAttempts,
      TargetAccounts,
      Accounts

entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress

version: 1.0.0
