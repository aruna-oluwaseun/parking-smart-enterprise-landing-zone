id: 831cc7e5-73bf-483b-a631-46534f97f6aa
name: Privileged Role Assignment Detected

description: |
  Detects assignment of privileged Microsoft Entra ID roles that may
  provide a user with elevated access and could indicate persistence
  or privilege escalation activity.

severity: High
enabled: true
kind: Scheduled
severity: High
enabled: true
kqlFile: privileged_role_assignment.kql
kind: Scheduled

queryFrequency: 5m
queryPeriod: 10m

triggerOperator: gt
triggerThreshold: 0

tactics:
  - Persistence
  - PrivilegeEscalation

relevantTechniques:
  - T1098

query: |
  AuditLogs
  | where OperationName has_any (
      "Add member to role",
      "Add eligible member to role",
      "Add scoped member to role"
  )
  | extend InitiatedByUser = tostring(InitiatedBy.user.userPrincipalName)
  | extend TargetUser = tostring(TargetResources[0].userPrincipalName)
  | project
      TimeGenerated,
      OperationName,
      InitiatedByUser,
      TargetUser,
      Result
  | order by TimeGenerated desc

entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: TargetUser

eventGroupingSettings:
  aggregationKind: SingleAlert

version: 1.0.0