id: ed9f08d6-54e9-49f4-ad07-10af579d62f6
name: Azure Policy deleted
description: |
  Detects deletion of Azure Policy assignments or definitions that may weaken governance controls.
severity: High
kind: Scheduled

queryFrequency: 5m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0

tactics:
  - DefenseEvasion

relevantTechniques:
  - T1562

query: |
  AzureActivity
  | where OperationNameValue has_any (
      "MICROSOFT.AUTHORIZATION/POLICYASSIGNMENTS/DELETE",
      "MICROSOFT.AUTHORIZATION/POLICYDEFINITIONS/DELETE"
  )
  | project
      TimeGenerated,
      Caller,
      OperationNameValue,
      ResourceGroup,
      ResourceId,
      ActivityStatusValue

entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: Caller

version: 1.0.0